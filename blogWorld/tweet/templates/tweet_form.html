{% extends "layout.html" %}

{% block title %}
blogApp
{% endblock %}

{% block content %}
<h3 class="ms-5 mt-5">
    {% if form.instance.pk %}
    Edit Tweet
    {% else %}
    Create Tweet
    {% endif %}

    <form method="post" enctype="multipart/form-data" class="form mt-2">
        {% csrf_token %}
        {{form.as_p}}
        <button class="btn btn-warning" type="submit">New Tweet</button>
    </form>
    <a href={% url 'tweet_list' %}>Back Home Page</a>
</h3>
{% endblock %}
